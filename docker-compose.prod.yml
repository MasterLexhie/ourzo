services:
  postgres:
    image: postgres:16-alpine
    container_name: ourzo-postgres-prod
    environment:
      POSTGRES_DB: ourzo
      POSTGRES_USER: ourzo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ourzo -d ourzo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: ourzo-redis-prod
    command: redis-server --requirepass-file /run/secrets/redis_password
    secrets:
      - redis_password
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: ourzo-api-prod
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://ourzo:${POSTGRES_PASSWORD}@postgres:5432/ourzo?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - NODE_ENV=production
    env_file:
      - ./apps/api/.env.production
    secrets:
      - postgres_password
      - redis_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

volumes:
  postgres_prod_data:

secrets:
  postgres_password:
    external: true
  redis_password:
    external: true